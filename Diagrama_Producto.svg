<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" fill="#f6f5f0"/><text x="450" y="45" font-family="Arial" font-size="24" text-anchor="middle" fill="#20624a">Embutidos La Vienesa | Entidad del CRUD</text><rect x="130" y="80" width="640" height="430" fill="white" stroke="#20624a" stroke-width="2"/><rect x="130" y="80" width="640" height="55" fill="#20624a"/><text x="450" y="115" font-family="Arial" font-size="22" text-anchor="middle" fill="white">Producto &lt;&lt;Entity&gt;&gt;</text><g font-family="Arial" font-size="21" fill="#26382e"><text x="155" y="172">- id: Long</text><text x="155" y="207">- nombre: String</text><text x="155" y="242">- presentacion: String</text><text x="155" y="277">- precio: BigDecimal</text><text x="155" y="312">- stock: Integer</text><text x="155" y="347">- activo: boolean</text><path d="M130 380 H770" stroke="#20624a"/><text x="155" y="415">+ Producto()</text><text x="155" y="450">+ Producto(nombre, presentacion, precio, stock)</text><text x="155" y="485">+ getters y setters</text></g><text x="450" y="555" text-anchor="middle" font-family="Arial" font-size="18">Tabla: producto | Borrado logico: activo = false</text><text x="450" y="590" text-anchor="middle" font-family="Arial" font-size="17">CRUD: ProductoRepository.crear / listar / actualizar / eliminar</text></svg>